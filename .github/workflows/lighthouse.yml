name: Lighthouse

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/lighthouse.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

permissions:
  contents: read

# Erisilebilirlik, en iyi uygulama ve SEO >= 0.9 bloke eder. Performans yalniz uyari:
# tam ekran WebGL harita (MapLibre) mobil kisitlamada ~0.55 olculdu (kabuk harita
# baglamiyla birlikte istemcide yukleniyor); kesfet sayfasi ~0.85.
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run build

      - uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./frontend/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
