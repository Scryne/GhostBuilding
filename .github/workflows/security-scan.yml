name: Weekly security audit

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# The same dependency audits also run on every push (ci.yml). This weekly run catches
# advisories published while the code did not change, and scans the built images.
jobs:
  python-deps:
    name: Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  npm-deps:
    name: npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  containers:
    name: Container images (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t ghostbuilding-backend:scan ./backend
          docker build -t ghostbuilding-frontend:scan ./frontend
      - name: Trivy (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghostbuilding-backend:scan
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Trivy (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghostbuilding-frontend:scan
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
